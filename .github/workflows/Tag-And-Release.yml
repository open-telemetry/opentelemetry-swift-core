name: Tag & Note Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: tag-note-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tag:
    name: Create Tag & Release
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for creating tags and releases  
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse version from branch (release/x.y.z)
        id: parse
        run: |
          set -euo pipefail
          REF="${GITHUB_EVENT_PULL_REQUEST_HEAD_REF}"
          if [[ "$REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Head branch must follow the format: release/x.y.z (got: $REF)"
            exit 1
          fi
        env:
          GITHUB_EVENT_PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Checkout merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # zizmor: ignore[artipacked] Credentials are required by the tag push below.
          persist-credentials: true
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check if tag exists remotely
        id: check-tag
        run: |
          set -euo pipefail
          VERSION="${STEPS_PARSE_OUTPUTS_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists on origin"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STEPS_PARSE_OUTPUTS_VERSION: ${{ steps.parse.outputs.version }}

      - name: Create and push tag
        if: steps.check-tag.outputs.exists != 'true'
        uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0
        with:
          commit_message: version bump to ${{ steps.parse.outputs.version }}
          tagging_message: '${{ steps.parse.outputs.version }}'

      - name: Create GitHub Release
        if: steps.check-tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: gh release create "$VERSION" --prerelease --generate-notes

  cocoapods:
    name: Push CocoaPods
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    needs: tag
    uses: ./.github/workflows/Push-CocoaPods.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
